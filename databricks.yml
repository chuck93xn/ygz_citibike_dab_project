# This is a Databricks asset bundle definition for ygz_citibike_dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ygz_citibike_dab_project
  uuid: 5598ceb3-9b8c-4614-b650-1b717f36bca3

include:
  - resources/*.yml

# artifacts for wheel build
artifacts:
  default:
    type: whl
    build: python -m build     # 这一行取代了你手动敲 python -m build
    path: .

sync:
  exclude:
    - .venv*/
    - "**/__pycache__/"
    - "**/*.pyc"

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: dab_citibike_dev
  dev_flag:
    default: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405613117311442.2.azuredatabricks.net
  
  test:
    mode: production
    workspace:
      host: https://adb-7405614713974958.18.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/106018876@student.swin.edu.au to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: dab_citibike_test
      dev_flag:
        default: false
    permissions:
      - service_principal_name: d311a39c-0fd9-43cc-8485-572bc361d91f
        level: CAN_MANAGE
    run_as:
      service_principal_name: d311a39c-0fd9-43cc-8485-572bc361d91f

  prod:
    mode: production
    workspace:
      host: https://adb-7405605159703263.3.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/106018876@student.swin.edu.au to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: dab_citibike_prod
      dev_flag:
        default: false
    permissions:
      - service_principal_name: 8bae55fc-35d9-49fc-b15f-83f545d8995b
        level: CAN_MANAGE
    run_as:
      service_principal_name: 8bae55fc-35d9-49fc-b15f-83f545d8995b

